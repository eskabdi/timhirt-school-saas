project_id = "school-saas"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
jwt_expiry = 3600                      # 60 min access token (INSA session control)
enable_signup = false                  # invite-only; onboarding via Edge Function
enable_refresh_token_rotation = true   # rotating refresh + reuse detection
refresh_token_reuse_interval = 10

[auth.email]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.run-payroll]
verify_jwt = true
[functions.process-fee-payment]
verify_jwt = true
[functions.manage-integration-credentials]
verify_jwt = true                      # super_admin only, checked in-code

[functions.onboard-tenant]
verify_jwt = true
[functions.generate-payslip-pdf]
verify_jwt = true
[functions.issue-id-card]
verify_jwt = true
[functions.invite-staff]
verify_jwt = true
[functions.provision-portal-accounts]
verify_jwt = true
[functions.verify-id]
verify_jwt = false                     # public verification; rate-limited in-code

[functions.submit-admission]
verify_jwt = false                     # public form; rate-limited + tenant-scoped in-code

[functions.check-admission-status]
verify_jwt = false                     # public status lookup; rate-limited in-code

[functions.chapa-webhook]
verify_jwt = false                     # HMAC signature verified in-code instead

[functions.check-login-attempt]
verify_jwt = false                     # public pre-auth gate; rate-limited in-code

[functions.record-fee-payment]
verify_jwt = true
[functions.issue-fee-document]
verify_jwt = true
[functions.enroll-finalize-billing]
verify_jwt = true
[functions.verify-admission-bank-url]
verify_jwt = false                     # public form; rate-limited + stage-gated in-code

[functions.process-import-job]
verify_jwt = true
[functions.process-export-job]
verify_jwt = true
[functions.process-library-circulation]
verify_jwt = true
[functions.generate-fee-invoices]
verify_jwt = true
