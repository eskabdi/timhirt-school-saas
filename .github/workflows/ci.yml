# CI/CD (§12.2) — lint, typecheck, unit tests, RLS suites, SAST, secret scan,
# dependency audit, build. Every third-party action is pinned to a full commit
# SHA with its tag in a comment (R6 WP-01); Dependabot proposes the bumps.
# Extend with `supabase db push` + `functions deploy` for staging/prod stages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: every job only reads the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # check:locales diffs against the base commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src --ext .ts,.tsx
      - run: npx vitest run
      # i18n gates. Both were being run by hand, which is one distraction away
      # from not being run at all. The locale check needs history to diff
      # against, hence fetch-depth 0 on the checkout above.
      - name: i18n — no untranslated user-facing copy
        run: npm run check:i18n
      - name: i18n — locale parity and no wholesale reformat
        run: npm run check:locales -- "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - name: Actions pinned to commit SHAs (R6 WP-01)
        run: bash scripts/ci/pinned-actions.sh
      - name: No online payment gateway (R6 WP-00, C-01)
        run: bash scripts/ci/no-payment-gateway.sh
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      # Edge Function unit tests. DENO_NO_PACKAGE_JSON + --node-modules-dir=none
      # stop Deno from resolving npm: imports out of the root node_modules.
      - name: Edge Function tests (Deno)
        run: DENO_NO_PACKAGE_JSON=1 deno test --node-modules-dir=none supabase/functions
      # Type-check every Edge Function entrypoint; ratchet against
      # supabase/security/deno_check_known.txt (R6 WP-01).
      - name: Edge Function type check (deno check)
        run: bash scripts/ci/deno-check.sh
      - name: Dependency audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      # Report-only until WP-14 fixes the known findings and adds --strict.
      - name: Project conventions (report-only)
        run: python3 scripts/ci/conventions.py
      - run: npm run build

  # RLS + payroll SoD + webhook-settlement pgTAP suites — supabase/tests/rls/*.sql
  # (cross-tenant matrix closing C-1, payroll SoD/immutability closing C-2/C-3,
  # atomic webhook settlement closing H-3/H-4). A failure here means one of those
  # regressions has come back.
  #
  # Runs against a plain Postgres service rather than `supabase start`. Booting
  # the full stack (GoTrue, Storage, Realtime, Kong, Studio) to execute four SQL
  # files was slow and kept hanging on image pulls; everything these suites touch
  # is Postgres-side and is provided by supabase/tests/shim.sql.
  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Postgres runs on the runner itself, not in a service container: pgTAP is
      # a server-side extension, so its files have to live where the postmaster
      # can load them — apt-installing it alongside a containerised Postgres
      # would put them on the wrong filesystem and `create extension pgtap`
      # would fail.
      - name: Install and start Postgres 16 with pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap postgresql-client-16
          sudo pg_ctlcluster 16 main start || sudo systemctl start postgresql@16-main
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      - name: Apply migrations and run pgTAP suites
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/run.sh

  # Secret scan and SAST (R6 WP-01). Both tools are proven to fail on planted
  # findings; see audit/FIXES_VERIFIED_R6.md (WP-01).
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # gitleaks scans the full history
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24"
          cache: false
      # Built from source through the Go checksum database, so the binary is
      # verified against the module's published hash (no curl | tar).
      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Secret scan (full history)
        run: $(go env GOPATH)/bin/gitleaks git . --redact --no-banner --exit-code 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install semgrep 1.95.0
        run: python -m pip install --disable-pip-version-check semgrep==1.95.0
      # The repo rules must still match every `ruleid:` line in the fixtures,
      # otherwise the SAST gate below could pass while matching nothing.
      - name: SAST rule self-test
        run: python3 scripts/ci/semgrep-rule-test.py
      - name: SAST (repo rules + OWASP Top 10 / TypeScript / React registry packs)
        run: >-
          semgrep scan --metrics=off --error
          --config .semgrep/timhirt-security.yml
          --config p/owasp-top-ten --config p/typescript --config p/react
          src supabase/functions
